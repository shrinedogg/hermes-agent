# Standalone build+publish for shrinedogg's custom image (custom build, not
# part of upstream). Triggers:
#   push:        on a build branch -> tags and pushes <IMAGE>:<SHA_TAG>
#   dispatch:    manual run with optional commit/tag inputs
#
# Deliberately NOT wired into ci.yaml or docker.yml: the stock docker.yml
# targets the upstream registry + blacksmith runners, neither of which apply
# to this fork's personal Docker Hub account. This workflow is GH-hosted
# (ubuntu-latest) and amd64-only: the consuming cluster1 node is x86_64.
#
# Publishes an immutable multi-part tag:
#   docker.io/shrinedogg/hermes-agent:<tag>
#   <tag> = catalog-harness2-<short-sha>   (default, from the push ref)
# or the `tag` dispatch input verbatim (no slashes, [a-z0-9][a-z0-9._-]*)
#
# Credentials: repo secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (write
# access to the shrinedogg Docker Hub account).
name: Docker Build and Publish (Docker Hub, shrinedogg)

on:
  push:
    branches:
      - 'build/dockerhub-*'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to build. Empty = the triggering branch head.'
        required: false
        default: ''
      tag:
        description: 'Image tag (no slashes). Empty = catalog-harness2-<short-sha>.'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: dockerhub-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: shrinedogg/hermes-agent

jobs:
  build:
    name: Build and publish (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve commit and tag
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_COMMIT" ]; then
            commit="$DISPATCH_COMMIT"
          else
            commit="${GITHUB_SHA}"
          fi
          short="$(echo "$commit" | cut -c1-7)"
          tag="${DISPATCH_TAG:-catalog-harness2-${short}}"
          # Tag grammar: no slashes, no uppercase surprises.
          case "$tag" in
            */*|*[!a-zA-Z0-9._-]*)
              echo "::error::tag '$tag' is not a valid Docker tag (no slashes, [a-zA-Z0-9._-] only)"
              exit 1
              ;;
          esac
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "=== Building $IMAGE_NAME:$tag from $commit ==="

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.commit }}
          # Full history: scripts/write_install_stamp.py needs reachable
          # release tags to compute the dev version (0.23.0+N distance).
          fetch-depth: 0

      - name: Reject profile exports in the build context
        run: python3 scripts/ci/check_profile_archive_boundary.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Docker Hub auth
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write install stamp
        env:
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          display="$(python3 -m scripts.releases.distance || true)"
          identity=(--commit "$COMMIT")
          if [ -n "$display" ]; then
            base="${display%%+*}"
            development="${display#+}"
            if [ "$development" = "$display" ]; then distance=0; else distance="${development%%.*}"; fi
            identity+=(--base-version "$base" --display-version "$display" --distance "$distance")
            echo "Display version: $display"
          fi
          python3 scripts/write_install_stamp.py --output install-stamp.json \
            --distribution docker --update-mechanism external --source ci "${identity[@]}"

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          load: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.tag }}
          cache-from: type=gha,scope=amd64-${{ env.IMAGE_NAME }}
          cache-to: type=gha,scope=amd64-${{ env.IMAGE_NAME }},mode=max
          build-args: |
            HERMES_BOT_DESKTOP=0

      - name: Verify published manifest
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_NAME:$TAG" \
            --format 'Published $IMAGE_NAME:$TAG (multi-arch index ready)'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Publish the digest for the Flux cutover to pin (immutable reference).
  report:
    name: Report digest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch digest
        id: read
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::build produced no tag"; exit 1; }
          digest="$(curl -s "https://hub.docker.com/v2/repositories/shrinedogg/hermes-agent/tags/$TAG" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["digest"])')"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::no digest for tag $TAG (image not published?)"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Summarize
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DIGEST: ${{ steps.read.outputs.digest }}
        run: |
          {
            echo '## Custom image published'
            echo
            echo 'Image: `shrinedogg/hermes-agent`'
            echo "Tag: \`$TAG\`"
            echo "Digest: \`$DIGEST\`"
            echo
            echo 'Cutover pin (deployment image line):'
            echo '```'
            echo "docker.io/shrinedogg/hermes-agent:$TAG@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
